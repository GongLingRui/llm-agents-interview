<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Agent Engineering Handbook</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="从 LLM 基础到 Production Agent 的系统化工程知识库" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root {
      --theme-color: #0f766e;
    }
    .sidebar {
      font-size: 14px;
    }
    .content {
      font-size: 16px;
      line-height: 1.7;
    }
    .markdown-section {
      max-width: 880px;
    }
    .markdown-section code {
      font-size: 0.9em;
    }
    .markdown-section .mermaid {
      margin: 1.25rem 0;
      overflow-x: auto;
      text-align: center;
    }
    .markdown-section .mermaid svg {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div id="app">加载中…</div>
  <script>
    // GitHub Pages 项目站：/llm-agents-interview/；本地根目录预览则为 /
    var GH_PAGES_BASE = '/llm-agents-interview/';
    var docsifyBasePath =
      location.pathname.indexOf(GH_PAGES_BASE) === 0 ? GH_PAGES_BASE : './';

    function resolveDocPath(baseFile, href) {
      if (!href || /^(https?:|mailto:|tel:)/i.test(href)) return href;
      if (href.charAt(0) === '#') return href;

      var hash = '';
      var hashIdx = href.indexOf('#');
      if (hashIdx >= 0) {
        hash = href.slice(hashIdx);
        href = href.slice(0, hashIdx);
      }
      if (!href) return hash;

      // 站点根绝对路径：去掉前导 /，交给 Docsify hash 路由
      if (href.charAt(0) === '/') {
        return href.replace(/^\//, '') + hash;
      }

      baseFile = String(baseFile || '').replace(/^\//, '');
      var baseDir = baseFile.indexOf('/') >= 0 ? baseFile.replace(/\/[^/]*$/, '/') : '';
      var parts = (baseDir + href).split('/');
      var stack = [];
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        if (!p || p === '.') continue;
        if (p === '..') {
          if (stack.length) stack.pop();
        } else {
          stack.push(p);
        }
      }
      return stack.join('/') + hash;
    }

    function rewriteRelativeMarkdownLinks(content, file) {
      var parts = content.split(/(```[\s\S]*?```|`[^`\n]+`)/g);
      for (var i = 0; i < parts.length; i++) {
        // 跳过 fenced / inline code
        if (parts[i].charAt(0) === '`') continue;
        parts[i] = parts[i].replace(
          /\]\((?!https?:|mailto:|tel:|#|\/)([^)\s]+)\)/g,
          function (_m, href) {
            return '](/' + resolveDocPath(file, href) + ')';
          }
        );
      }
      return parts.join('');
    }

    window.$docsify = {
      name: 'Agent Engineering Handbook',
      nameLink: '#/',
      repo: 'VanGong1999/llm-agents-interview',
      homepage: 'README.md',
      basePath: docsifyBasePath,
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      // 正文相对当前文档解析；侧栏/_navbar 使用 / 绝对路径避免嵌套页下 404
      relativePath: true,
      maxLevel: 4,
      search: {
        placeholder: '搜索',
        noData: '无结果',
        paths: 'auto',
        depth: 3
      },
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      },
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true,
        crossChapterText: true
      },
      mermaidConfig: {
        startOnLoad: false,
        theme: 'default',
        securityLevel: 'loose',
        flowchart: { htmlLabels: true, curve: 'basis' }
      },
      plugins: [
        function (hook, vm) {
          hook.beforeEach(function (content) {
            var file = vm.route.file || vm.route.path || '';
            if (!file || file === '/') return content;
            return rewriteRelativeMarkdownLinks(content, file);
          });
        }
      ]
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2.0.0/dist/docsify-mermaid.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
</body>
</html>
